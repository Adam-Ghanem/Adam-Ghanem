  .dot-r { fill: #ff5f56; }
  .dot-y { fill: #ffbd2e; }
  .dot-g { fill: #27c93f; }
  .title { font-family: "SFMono-Regular","Consolas","Liberation Mono",monospace; font-size: 13px; fill: #6e7681; text-anchor: middle; }
  .ascii-line { font-family: "SFMono-Regular","Consolas","Liberation Mono",monospace; font-size: 7.2px; fill: #8b98a5; white-space: pre; opacity: 0; animation: fadein 0.3s ease-out forwards; }
  .info-head, .info-line { font-family: "SFMono-Regular","Consolas","Liberation Mono",monospace; opacity: 0; animation: fadein 0.4s ease-out forwards; }
  .info-head { font-size: 15px; fill: #7ee787; font-weight: 600; }
  .info-line { font-size: 15px; fill: #c9d1d9; }
  .key { fill: #79c0ff; }
  .value { fill: #f0f6fc; }
  .prompt { font-family: "SFMono-Regular","Consolas","Liberation Mono",monospace; font-size: 13px; }
  .p-user { fill: #7ee787; }
  .p-sep { fill: #6e7681; }
  .p-path { fill: #79c0ff; }
  .p-cmd { fill: #c9d1d9; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
</style>
