name: Render original Eye to Space animation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-eye-profile.yml'
      - 'scripts/render_eye_profile.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-gif:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        run: python -m pip install numpy pillow
      - name: Export original frames into GIF
        run: python scripts/render_eye_profile.py
      - name: Commit rendered animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/eye_original_animation.gif
          git diff --cached --quiet || (git commit -m "Render original Eye to Space GIF for profile" && git push)
